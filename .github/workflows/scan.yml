# Runs one scan cycle every 5 minutes on GitHub's servers and commits the paper book back.
# Secret needed: Settings > Secrets and variables > Actions > New secret NTFY_TOPIC = your topic name.
name: memecoin-scan
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:
    inputs:
      test_push:
        description: "Only send a demo BUY alert to the phone"
        type: boolean
        default: false
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test alert
        if: ${{ inputs.test_push }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 run.py --test-signal
      - name: Scan and paper trade (no wallet, no real orders)
        if: ${{ !inputs.test_push }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 run.py --tick --mode moonshot
          python3 run.py --tick --mode early
      - name: Save paper book
        if: ${{ !inputs.test_push }}
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -f paper_state_*.json paper_journal_*.csv signals_*.csv data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "paper book $(date -u +%FT%TZ)"
          git push || (git pull --rebase && git push)
